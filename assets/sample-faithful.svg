<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="자료 충실형 Markdown 노트의 구성 예시"><rect x="0.5" y="0.5" width="559" height="759" rx="10" fill="#ffffff" stroke="#d5dbe1"/><text x="40" y="40" font-size="12" fill="#1f4e79" font-weight="700" text-anchor="start">자료 충실형 (faithful) · Markdown</text><text x="520" y="40" font-size="12" fill="#66727f" font-weight="400" text-anchor="end">과목A · 3주차</text><line x1="40" y1="52" x2="520" y2="52" stroke="#d5dbe1"/><text x="40" y="88" font-size="19" fill="#1f2933" font-weight="700" text-anchor="start"># 과목A 3주차 학습노트</text><text x="40" y="128" font-size="15" fill="#1f2933" font-weight="700" text-anchor="start">## 1. 단원 제목</text><text x="40" y="156" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">- <tspan font-weight='700'>정의</tspan>:</text><rect x="104" y="147" width="416" height="7" rx="3.5" fill="#dfe4ea"/><text x="40" y="178" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start">- <tspan font-weight='700'>키워드</tspan>:</text><rect x="116" y="169" width="250" height="7" rx="3.5" fill="#dfe4ea"/><rect x="40" y="198" width="480" height="76" rx="4" fill="#eaf2f8"/><rect x="40" y="198" width="4" height="76" fill="#1f4e79"/><text x="56" y="220" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="start">교수 설명:</text><text x="126" y="220" font-size="12" fill="#66727f" font-weight="400" text-anchor="start">교안에 없는 구두 설명·예시·정정</text><rect x="56" y="234" width="448" height="7" rx="3.5" fill="#dfe4ea"/><rect x="56" y="249" width="380" height="7" rx="3.5" fill="#dfe4ea"/><text x="40" y="312" font-size="13.5" fill="#1f2933" font-weight="700" text-anchor="start">### 대비 정리</text><rect x="40" y="326" width="480" height="30" fill="#1f4e79" stroke="#d5dbe1"/><text x="120" y="346" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">구분</text><text