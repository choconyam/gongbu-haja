 x1="40" y1="660" x2="520" y2="660" stroke="#d5dbe1"/><text x="40" y="686" font-size="11.5" fill="#66727f" font-weight="400" text-anchor="start">교안 + 검수된 교수 설명만 정리 · 외부 배경지식 없음</text><text x="40" y="706" font-size="11.5" fill="#66727f" font-weight="400" text-anchor="start">확정하지 못한 표현은 그 자리에 표시</text><text x="280.0" y="744" font-size="11" fill="#66727f" font-weight="400" text-anchor="middle">일반 텍스트 파일이라 바로 열어 읽고 고칠 수 있다</text></svg>
