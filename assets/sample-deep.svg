<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="심화 이해형 PDF 노트의 배치 예시: 원본 교안 슬라이드 아래에 대응 설명"><rect x="0.5" y="0.5" width="559" height="759" rx="10" fill="#ffffff" stroke="#d5dbe1"/><text x="40" y="40" font-size="12" fill="#1f4e79" font-weight="700" text-anchor="start">심화 이해형 (deep) · PDF</text><text x="520" y="40" font-size="12" fill="#66727f" font-weight="400" text-anchor="end">과목A · 3주차</text><line x1="40" y1="52" x2="520" y2="52" stroke="#d5dbe1"/><rect x="85" y="70" width="390" height="170" rx="4" fill="#f4f6f8" stroke="#66727f" stroke-dasharray="6 4"/><text x="280.0" y="151.0" font-size="15" fill="#66727f" font-weight="700" text-anchor="middle">원본 교안 슬라이드 자리</text><text x="280.0" y="173.0" font-size="11.5" fill="#66727f" font-weight="400" text-anchor="middle">(교안 PDF의 해당 쪽이 그대로 들어간다)</text><text x="280.0" y="257" font-size="11" fill="#66727f" font-weight="400" text-anchor="middle">원본 PDF p.12</text><text x="40" y="284" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="start">핵심 메시지와 연결</text><rect x="40" y="294" width="480" height="7" rx="3.5" fill="#dfe4ea"/><rect x="40" y="309" width="452" height="7" rx="3.5" fill="#dfe4ea"/><rect x="40" y="324" width="300" height="7" rx="3.5" fill="#dfe4ea"/><text x="40" y="358" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="start">그림·표·식 읽기</text><rect x="40" y="368" width="480" height="7" rx="3.5" fill="#dfe4ea"/><rect x="40" y="383" width="466" height="7" rx="3.5" fill="#dfe4ea"/><rect x="40" y="398" width="210" height="7" rx="3.5" fill="#dfe4ea"/><text x="40" y="432" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="start">핵심 풀이·유도</text><rect x="40" y="442" width="470" height="7" rx="3.5" fill="#dfe4ea"/><rect x="150" y="460" width="260" height="34" rx="4" fill="#ffffff" stroke="#d5dbe1"/><text x="280" y="482" font-size="12" fill="