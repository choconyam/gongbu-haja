<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif" role="img" aria-label="심화 이해형 PDF 노트의 배치 예시: 원본 교안 슬라이드 아래에 대응 설명"><rect x="0.5" y="0.5" width="559" height="759" rx="10" fill="#8b949e" fill-opacity="0.18" stroke="#d5dbe1"/><text x="46" y="28" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="start">심화 이해형 (deep)</text><text x="514" y="28" font-size="12" fill="#66727f" font-weight="400" text-anchor="end">PDF · 인쇄용</text><rect x="49" y="48" width="468" height="672" fill="#000000" fill-opacity="0.12"/><rect x="46" y="44" width="468" height="672" fill="#ffffff" stroke="#c4ccd4"/><rect x="110" y="74" width="340" height="150" rx="3" fill="#f4f6f8" stroke="#66727f" stroke-dasharray="6 4"/><text x="280.0" y="145.0" font-size="15" fill="#66727f" font-weight="700" text-anchor="middle">원본 교안 슬라이드 자리</text><text x="280.0" y="167.0" font-size="11.5" fill="#66727f" font-weight="400" text-anchor="middle">(교안 PDF의 해당 쪽이 그대로 들어간다)</text><text x="280.0" y="240" font-size="10.5" fill="#66727f" font-weight="400" text-anchor="middle">원본 PDF p.12</text><text x="86" y="266" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">핵심 메시지와 연결</text><rect x="86" y="276" width="388" height="7" rx="3.5" fill="#dfe4ea"/><rect x="86" y="291" width="362" height="7" rx="3.5" fill="#dfe4ea"/><rect x="86" y="306" width="250" height="7" rx="3.5" fill="#dfe4ea"/><text x="86" y="338" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">그림·표·식 읽기</text><rect x="86" y="348" width="388" height="7" rx="3.5" fill="#dfe4ea"/><rect x="86" y="363" width="374" height="7" rx="3.5" fill="#dfe4ea"/><rect x="86" y="378" width="180" height="7" rx="3.5" fill="#dfe4ea"/><text x="86" y="410" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">핵심 풀이·유도</text><rect x="86" y="420" width="380" height="7" rx="3.5" fill="#dfe4ea"/><text x="280.0" y="456" font-size="15" fill="#66727f" font-weight="400" text-anchor="middle" font-family="'Cambria Math','Times New Roman',serif">y  =  f(x)  +  …</text><text x="280.0" y="474" font-size="10.5" fill="#66727f" font-weight="400" text-anchor="middle">수식은 교과서식으로 조판</text><rect x="86" y="488" width="388" height="7" rx="3.5" fill="#dfe4ea"/><rect x="86" y="503" width="270" height="7" rx="3.5" fill="#dfe4ea"/><text x="86" y="536" font-size="12" fill="#1f2933" font-weight="700" text-anchor="start">의미와 주의점</text><rect x="86" y="546" width="388" height="7" rx="3.5" fill="#dfe4ea"/><rect x="86" y="561" width="210" height="7" rx="3.5" fill="#dfe4ea"/><rect x="110" y="584" width="340" height="96" rx="3" fill="#f4f6f8" stroke="#66727f" stroke-dasharray="6 4"/><text x="280.0" y="628.0" font-size="15" fill="#66727f" font-weight="700" text-anchor="middle">원본 교안 슬라이드 자리</text><text x="280.0" y="650.0" font-size="11.5" fill="#66727f" font-weight="400" text-anchor="middle">(교안 PDF의 해당 쪽이 그대로 들어간다)</text><text x="280.0" y="696" font-size="10.5" fill="#66727f" font-weight="400" text-anchor="middle">원본 PDF p.13</text><text x="280.0" y="744" font-size="11" fill="#66727f" font-weight="400" text-anchor="middle">설명이 끝난 자리에서 다음 슬라이드가 같은 쪽에 바로 이어진다</text></svg>
